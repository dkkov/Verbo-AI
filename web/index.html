<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verbo — AI-консультант школы английского</title>
  <link rel="preload" href="/assets/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/assets/fonts/manrope-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>

  <div class="app">
    <!-- Шапка -->
    <header class="topbar">
      <div class="brand">
        <div class="brand__logo has-img" id="brand-logo"><img src="/assets/logo.png" alt="Verbo" /></div>
        <div class="brand__text">
          <div class="brand__name">Verbo</div>
          <div class="brand__sub" data-i18n="tagline">Онлайн-школа английского · AI-консультант</div>
        </div>
      </div>
      <div class="lang" role="group" aria-label="Language">
        <button class="lang__btn is-active" data-lang="ru">RU</button>
        <button class="lang__btn" data-lang="en">EN</button>
      </div>
    </header>

    <!-- Основная область -->
    <main class="main" id="main">
      <!-- Онбординг (скрывается после первого сообщения) -->
      <section class="hero" id="hero">
        <div class="hero__wave" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/></svg>
        </div>
        <h1 class="hero__title" data-i18n="heroTitle">Чем могу помочь?</h1>
        <p class="hero__sub" data-i18n="heroSub">Спросите о ценах, форматах и расписании — или запишитесь на бесплатное пробное занятие.</p>

        <!-- Крупные кнопки действий -->
        <div class="actions" id="actions"></div>

        <!-- Аккордеон услуг -->
        <div class="cards">
          <div class="card" id="card-services">
            <button class="card__head" data-acc="services">
              <div class="card__label">
                <span class="card__title" data-i18n="servicesTitle">Услуги и цены</span>
                <span class="card__meta" id="services-meta"></span>
              </div>
              <span class="card__chev" aria-hidden="true">⌄</span>
            </button>
            <div class="card__body" id="services-body"></div>
          </div>
        </div>
      </section>

      <!-- Лента сообщений -->
      <section class="chat" id="chat" aria-live="polite"></section>
    </main>

    <!-- Ввод -->
    <footer class="composer">
      <div class="composer__inner">
        <textarea id="input" rows="1" placeholder="Спросите о ценах или запишитесь на пробное занятие" data-i18n-ph="inputPh"></textarea>
        <button id="mic" class="mic" aria-label="Записать голосом" title="Голосовой ввод">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" x2="12" y1="19" y2="22"></line></svg>
        </button>
        <button id="send" class="send" aria-label="Отправить">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </div>
      <div class="composer__hint" data-i18n="disclaimer">Verbo AI · отвечает по базе знаний школы</div>
    </footer>
  </div>

  <!-- Панель «Заявки» — открывается по адресу …/#admin (для владельца) -->
  <div class="modal" id="admin-modal" hidden>
    <div class="modal__box">
      <div class="modal__head">
        <span data-i18n="leadsTitle">Заявки</span>
        <button class="modal__close" id="admin-close" aria-label="Закрыть">✕</button>
      </div>
      <div class="modal__body" id="admin-body">
        <input type="password" id="admin-pass" placeholder="Пароль администратора" data-i18n-ph="passPh" />
        <button class="btn" id="admin-load" data-i18n="leadsLoad">Показать</button>
        <div class="admin-status" id="admin-status"></div>
        <div class="admin-table" id="admin-table"></div>
      </div>
    </div>
  </div>

  <!-- Полноэкранный голосовой режим («звонок») -->
  <div class="voice" id="voice-overlay" hidden>
    <div class="voice__top">Verbo · голосовой режим</div>
    <div class="voice__center">
      <button class="voice__orb" id="voice-orb" aria-label="Говорить"></button>
      <div class="voice__status" id="voice-status">Говорите…</div>
    </div>
    <div class="voice__log" id="voice-log" aria-live="polite"></div>
    <button class="voice__end" id="voice-end">✕ Завершить</button>
  </div>

  <script src="/app.js"></script>
</body>
</html>
