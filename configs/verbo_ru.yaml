# Конфиг школы «Verbo» (RU) — точная копия исходных данных knowledge.py.
# Смена ниши/языка = новый такой файл + SCHOOL_CONFIG=configs/<name>.yaml.
language: ru
currency: UAH

business:
  name: Verbo
  about: >-
    Онлайн-школа английского языка «Verbo». Работает с 2019 года,
    более 2400 выпускников.
  schedule: "с 8:00 до 22:00 по Киеву, понедельник–суббота. Воскресенье — выходной."
  platform: "Zoom + личный кабинет с домашними заданиями и записями занятий."
  levels: "A1–C1."
  entry: "Вход через бесплатный тест уровня (25 минут, онлайн) или пробное занятие."
  trial: >-
    Пробное занятие: бесплатное, 30 минут, включает определение уровня
    и план обучения.

formats:
  - key: individual
    title: "Индивидуальные занятия"
    duration: "50 минут"
    price: "550 грн за занятие"
  - key: mini_group
    title: "Мини-группы до 4 человек"
    duration: "60 минут"
    price: "320 грн за занятие"
  - key: speaking_club
    title: "Разговорный клуб"
    duration: "2 встречи в неделю"
    price: "900 грн в месяц"

packages:
  - key: pack_8
    title: "Пакет 8 индивидуальных занятий"
    price: "3960 грн"
    note: "скидка 10%"
  - key: pack_16
    title: "Пакет 16 индивидуальных занятий"
    price: "7480 грн"
    note: "скидка 15%"

directions:
  - "General English"
  - "Business English"
  - "подготовка к IELTS"
  - "английский для IT"
  - "разговорная практика"
  - "английский для детей 8–14 лет"

teachers:
  - name: "Олена Ковальчук"
    focus: "Business English, корпоративные группы"
    experience: "8 лет опыта"
    cert: "CELTA"
  - name: "Дмитрий Савченко"
    focus: "подготовка к IELTS (собственный балл 8.0)"
    experience: "6 лет опыта"
    cert: "TKT"
  - name: "Мария Гринь"
    focus: "дети и подростки, игровая методика"
    experience: "5 лет опыта"
    cert: "CELTA"
  - name: "Adam Price"
    focus: "носитель языка (Великобритания), разговорная практика и произношение"
    experience: ""
    cert: ""
  - name: "Ирина Мельник"
    focus: "методист школы, уровень C2, General English и внутренние аттестации"
    experience: ""
    cert: ""

teachers_summary: "Всего 12 преподавателей, все с CELTA или TKT."

policies:
  payment: "Оплата помесячно или пакетами, карта / IBAN. Пакеты действуют 3 месяца."
  cancellation: "Отмена занятия: не позднее чем за 12 часов, иначе занятие сгорает."
  freeze: "Заморозка: до 14 дней раз в полгода без потери оплаченных занятий."
  refund: >-
    Возврат за неиспользованные занятия пакета — по заявлению,
    в течение 10 рабочих дней.

contacts:
  phone: "+380 44 123 45 67"
  email: "hello@verbo.school"
  telegram: "@verbo_support"

contact_validation:
  mode: ua

# Пользовательские строки интерфейса (тон бизнеса, язык клиента).
ui:
  greeting: >-
    Здравствуйте! Я консультант онлайн-школы английского «Verbo».
    Помогу разобраться с форматами и ценами, отвечу на вопросы о школе
    и запишу на бесплатное пробное занятие. Что вас интересует?
  error_prefix: >-
    Извините, у меня возникла техническая заминка. Попробуйте, пожалуйста,
    написать ещё раз чуть позже или свяжитесь со школой напрямую:
  voice_not_recognized: "Извините, не расслышал. Скажите ещё раз, пожалуйста."
  examples:
    - "Сколько стоит индивидуальное занятие?"
    - "Хочу записаться на пробное"
    - "Готовите к IELTS?"
    - "Можно ли заморозить пакет?"
